[package]
name = "relay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
form_urlencoded = "1.2.2"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "form"] }
rustls-acme = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.4"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
