<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>近接ボイスチャット</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <h1>近接ボイスチャット</h1>
  <p class="sub">ゲーム内で <b>V</b> を押している間だけマイクが送られる。ここを操作する必要はない。</p>

  <div class="panel">
    <div class="actions">
      <button id="connect" class="primary">接続</button>
      <button id="disconnect" disabled>切断</button>
      <span id="link" class="pill warn">未接続</span>
      <span id="ptt" class="pill">待機</span>
    </div>
    <p class="note" id="msg">「接続」を押すと Steam のセッションでリレーに繋ぎ、マイクを準備する。</p>
  </div>

  <div class="panel">
    <h2>いま聞こえている人</h2>
    <ul id="voices" style="list-style:none;padding:0;margin:0;min-height:2.2em"></ul>
    <p class="note">
      喋っていて<b>実際に聞こえている</b>相手だけを出す。距離も方位も出さない —
      出すと配信画面がそのまま ESP になる。
    </p>
  </div>

  <div class="panel">
    <h2>音量</h2>
    <label class="row"><span>全体</span><input id="vol" type="range" min="0" max="150" step="1" value="100"><output id="volOut">100%</output></label>
  </div>

  <p class="note">
    不具合の切り分けには <a href="dev.html">開発モード</a>（リレー無しで距離減衰と定位だけを確かめる）。
  </p>
</main>

<script src="js/protocol.js"></script>
<script src="js/audio.js"></script>
<script src="js/signal.js"></script>
<script src="js/rtc.js"></script>
<script src="js/mic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
